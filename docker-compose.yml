services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jp
      POSTGRES_PASSWORD: jp
      POSTGRES_DB: jp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jp -d jp']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://jp:jp@db:5432/jp
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - '8080:80'
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
